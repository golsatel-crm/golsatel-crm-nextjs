<!DOCTYPE html>
<html>
<head>
  <title>Golsatel CRM - Supervisores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h1>Golsatel CRM</h1>
    <a href="dashboard.html">Dashboard</a>
    <a href="#" onclick="logout()">Cerrar sesión</a>
  </div>

  <div class="container">
    <h2>Gestión de Supervisores</h2>
    
    <h3>Agregar Nuevo Supervisor</h3>
    <form onsubmit="addSupervisor(event)">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="nombre" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Ciudad</label>
        <input type="text" id="ciudad">
      </div>
      <button type="submit">Guardar Supervisor</button>
    </form>

    <h3>Lista de Supervisores</h3>
    <table id="table">
      <tr><th>Nombre</th><th>Email</th><th>Ciudad</th><th>Acciones</th></tr>
    </table>
  </div>

  <script>
    const user = localStorage.getItem('user');
    if(!user) window.location.href = 'login.html';

    let supervisores = JSON.parse(localStorage.getItem('supervisores')) || [];

    function saveSupervisores() {
      localStorage.setItem('supervisores', JSON.stringify(supervisores));
      loadTable();
    }

    function addSupervisor(e) {
      e.preventDefault();
      supervisores.push({
        id: Date.now(),
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        ciudad: document.getElementById('ciudad').value
      });
      saveSupervisores();
      document.getElementById('nombre').value = '';
      document.getElementById('email').value = '';
      document.getElementById('ciudad').value = '';
    }

    function deleteSupervisor(id) {
      if(confirm('¿Eliminar?')) {
        supervisores = supervisores.filter(s => s.id !== id);
        saveSupervisores();
      }
    }

    function loadTable() {
      let html = '<tr><th>Nombre</th><th>Email</th><th>Ciudad</th><th>Acciones</th></tr>';
      supervisores.forEach(s => {
        html += `<tr><td>${s.nombre}</td><td>${s.email}</td><td>${s.ciudad || '-'}</td><td><button class="btn-danger" onclick="deleteSupervisor(${s.id})">Eliminar</button></td></tr>`;
      });
      document.getElementById('table').innerHTML = html;
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    loadTable();
  </script>
</body>
</html>
