<!DOCTYPE html>
<html>
<head>
  <title>Golsatel CRM - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 100px;">
    <h1>Golsatel CRM - Login</h1>
    <form onsubmit="login(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" value="admin@test.com" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" value="test" required>
      </div>
      <button type="submit">Ingresar</button>
    </form>
  </div>

  <script>
    function login(e) {
      e.preventDefault();
      localStorage.setItem('user', document.getElementById('email').value);
      window.location.href = 'dashboard.html';
    }
    if(localStorage.getItem('user')) window.location.href = 'dashboard.html';
  </script>
</body>
</html>
