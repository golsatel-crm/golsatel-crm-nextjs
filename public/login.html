<!DOCTYPE html>
<html>
<head>
  <title>Golsatel CRM - Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 100px;">
    <h1>Golsatel CRM - Login</h1>
    <div id="message"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Ingresar</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://zagydqofegylrparessp.supabase.co";
    const SUPABASE_KEY = "sb_publLsable_n7Zr8FH8Thuy3xyqCRhw_cUkyR...";
    let supabase;

    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(e) {
      console.error("Error inicializando Supabase:", e);
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = "dashboard.html";
      } catch(error) {
        document.getElementById("message").innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
      }
    });

    supabase.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
