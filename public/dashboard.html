<!DOCTYPE html>
<html>
<head>
  <title>Golsatel CRM - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h1>Golsatel CRM</h1>
    <a href="supervisores.html">Supervisores</a>
    <a href="#" onclick="logout()">Cerrar sesión</a>
  </div>
  <div class="container">
    <h2>Dashboard</h2>
    <p>Bienvenido: <strong id="user"></strong></p>
    <p id="stats">Cargando...</p>
  </div>
  <script>
    const user = localStorage.getItem('user');
    if(!user) window.location.href = 'login.html';
    document.getElementById('user').innerText = user;
    document.getElementById('stats').innerText = 'Supervisores: 0 (conecta Supabase para ver datos)';
    
    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
