<!DOCTYPE html>
<html>
<head>
  <title>Golsatel CRM - Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="navbar">
    <h1>Golsatel CRM</h1>
    <a href="supervisores.html">Supervisores</a>
    <a href="#" onclick="logout()">Cerrar sesión</a>
  </div>

  <div class="container">
    <h2>Dashboard</h2>
    <div id="stats"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
    const SUPABASE_KEY = "YOUR_ANON_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadDashboard() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) window.location.href = "login.html";

      const { data: supervisores } = await supabase.from("supervisores").select("*");
      
      document.getElementById("stats").innerHTML = `
        <p><strong>Supervisores registrados:</strong> ${supervisores?.length || 0}</p>
        <p><strong>Usuario:</strong> ${session.user.email}</p>
      `;
    }

    async function logout() {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    }

    loadDashboard();
  </script>
</body>
</html>
